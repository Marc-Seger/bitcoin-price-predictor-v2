name: Weekly Pipeline Health Monitor

on:
  schedule:
    # Run every Monday at 08:00 UTC (daily pipeline runs at 22:00 UTC Sunday)
    - cron: '0 8 * * 1'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run health checks
        id: checks
        run: |
          python - << 'EOF'
          import pandas as pd
          import numpy as np
          import json
          import os
          from datetime import datetime, timezone

          # ─────────────────────────────────────────────────────────────────────
          # This job used to ask "is the model still accurate?". That question is
          # settled: an audit in August 2026 found target leakage in the original
          # walk-forward evaluation. With the leak removed the model sits at ~48%
          # direction accuracy, and the live log agrees (~49%). It has no edge, and
          # alerting on that every week would be permanent noise.
          #
          # So the job now asks "is the machinery still working?" — data arriving,
          # predictions being logged, params not ancient. Accuracy is REPORTED as a
          # number, and only alerts if it moves far from ~50% in EITHER direction:
          # a sudden jump is far more likely to be a new leak than a real discovery.
          #
          # Rule for every check below: a check that cannot RUN must raise an alert,
          # never a silent note. The previous version appended failures to `details`
          # (informational) instead of `issues` (alerting), so when a date-parsing
          # error killed the trade log reads in March 2026, the job reported "all
          # clear" every week for five months with a green checkmark.
          # ─────────────────────────────────────────────────────────────────────

          issues = []
          details = []
          today = datetime.now(timezone.utc)
          today_naive = pd.Timestamp(today).tz_localize(None)

          TRADE_LOG = "app/data/trade_log.csv"
          PARAMS    = "results/tuning/xgboost_best_params_v2.json"

          # Accuracy is expected to sit near the 50% coin-flip line. Outside this
          # band (with enough samples) means something changed mechanically —
          # a leak, a sign flip, a broken join — not that the model got smart.
          ACC_LOW, ACC_HIGH, ACC_MIN_N = 0.30, 0.70, 20
          STALE_DAYS      = 3    # no prediction logged in this many days
          CADENCE_WINDOW  = 14   # look back this far...
          CADENCE_MIN     = 7    # ...and expect at least this many predictions
          RETUNE_MAX_DAYS = 90


          def read_trade_log():
              """
              format='mixed' is deliberate. One legacy row (2026-03-28) stores its
              date as '2026-03-28 00:00:00' while every other row is plain
              '2026-04-16'. Pandas infers the format from the first value and then
              raises on the rest. That single inconsistency, left behind by a manual
              repair, is what silently disabled this entire workflow.
              """
              tl = pd.read_csv(TRADE_LOG)
              for col in ("prediction_date", "target_date"):
                  if col in tl.columns:
                      tl[col] = pd.to_datetime(tl[col], format="mixed")
              return tl


          # ── 1. Pipeline liveness: is the daily job still logging predictions? ──
          try:
              tl = read_trade_log()
              if len(tl) == 0:
                  issues.append("**Trade log is empty** — no predictions have ever been logged.")
              else:
                  last_pred = tl["prediction_date"].max()
                  days_stale = (today_naive - last_pred).days
                  details.append(f"Last prediction logged: {last_pred.date()} ({days_stale}d ago)")
                  if days_stale > STALE_DAYS:
                      issues.append(
                          f"**No new prediction in {days_stale} days** — the daily pipeline may be failing. "
                          f"Check the 'Daily Data Update & Prediction' workflow."
                      )

                  # Cadence: catches the partial case where the job runs but quietly
                  # skips most days (validation gate failing, dedup, stale features).
                  recent = tl[tl["prediction_date"] >= (today_naive - pd.Timedelta(days=CADENCE_WINDOW))]
                  details.append(f"Predictions in last {CADENCE_WINDOW}d: {len(recent)}")
                  if len(recent) < CADENCE_MIN:
                      issues.append(
                          f"**Only {len(recent)} predictions in the last {CADENCE_WINDOW} days** "
                          f"(expected at least {CADENCE_MIN}). The pipeline is running but skipping days."
                      )
          except Exception as e:
              issues.append(f"**Pipeline liveness check could not run**: `{type(e).__name__}: {e}`")

          # ── 2. Accuracy: reported always, alerts only on a suspicious move ─────
          try:
              tl = read_trade_log()
              resolved = tl.dropna(subset=["actual_return", "correct"]).sort_values("prediction_date")

              if len(resolved) < 10:
                  details.append(f"Accuracy: only {len(resolved)} resolved predictions — need 10+ to report")
              else:
                  all_acc = resolved["correct"].mean()
                  naive   = (resolved["actual_return"] > 0).mean()
                  last30  = resolved[resolved["target_date"] >= (today_naive - pd.Timedelta(days=30))]
                  details.append(
                      f"Live accuracy: {all_acc:.1%} all-time over {len(resolved)} resolved "
                      f"(naive always-up: {naive:.1%})"
                  )
                  if len(last30) >= 5:
                      details.append(f"Live accuracy: {last30['correct'].mean():.1%} over last 30d ({len(last30)} resolved)")

                  # Expected state is ~50%. Flag large deviations in either direction.
                  if len(resolved) >= ACC_MIN_N:
                      if all_acc > ACC_HIGH:
                          issues.append(
                              f"**Accuracy jumped to {all_acc:.1%}** over {len(resolved)} predictions. "
                              f"This model has no established edge, so a result this good is more likely "
                              f"a data leak or a join bug than a genuine improvement. Investigate before celebrating."
                          )
                      elif all_acc < ACC_LOW:
                          issues.append(
                              f"**Accuracy collapsed to {all_acc:.1%}** over {len(resolved)} predictions. "
                              f"Consistently worse than chance usually means an inverted sign or a misaligned join."
                          )
          except Exception as e:
              issues.append(f"**Accuracy check could not run**: `{type(e).__name__}: {e}`")

          # ── 3. Retune age ─────────────────────────────────────────────────────
          # Read from a `tuned_at` field committed inside the params file. The old
          # version used os.path.getmtime(), which in Actions only ever measures the
          # checkout time — every file looks seconds old, so this never fired.
          try:
              with open(PARAMS) as f:
                  params = json.load(f)
              tuned_at = params.get("tuned_at")
              if not tuned_at:
                  issues.append(
                      f"**No `tuned_at` field in {PARAMS}** — retune age cannot be determined. "
                      f"Add it when saving tuned parameters."
                  )
              else:
                  days_since = (today_naive - pd.Timestamp(tuned_at)).days
                  details.append(f"Days since last retune: {days_since}d (tuned {tuned_at})")
                  if days_since > RETUNE_MAX_DAYS:
                      issues.append(
                          f"**Model params are {days_since} days old** (threshold: {RETUNE_MAX_DAYS}). "
                          f"Consider running `tune_xgboost.py`, and note the known methodology fixes first."
                      )
          except Exception as e:
              issues.append(f"**Retune age check could not run**: `{type(e).__name__}: {e}`")

          # ── Output for next step ──────────────────────────────────────────────
          has_issues = len(issues) > 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_issues={'true' if has_issues else 'false'}\n")

          issue_body = "\n\n".join([
              "## Weekly Pipeline Health Report",
              f"**Date**: {today.strftime('%Y-%m-%d')}",
              "### Checks",
              "\n".join(f"- {d}" for d in details) if details else "- (no checks reported)",
              "### Action Required" if has_issues else "### Status: All Clear",
              ("\n".join(f"- {i}" for i in issues)) if has_issues else "No action needed this week.",
              "---",
              "_Opened automatically by the Weekly Pipeline Health Monitor workflow._"
          ])

          with open("/tmp/issue_body.txt", "w") as f:
              f.write(issue_body)

          print("=== Health Check Results ===")
          for d in details:
              print(f"  {d}")
          if has_issues:
              print(f"\n{len(issues)} issue(s) found - will open GitHub Issue")
              for i in issues:
                  print(f"  - {i}")
          else:
              print("\nAll checks passed")
          EOF

      - name: Open GitHub Issue if action needed
        if: steps.checks.outputs.has_issues == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="[Pipeline Monitor] Action required — $(date -u +%Y-%m-%d)"
          BODY=$(cat /tmp/issue_body.txt)

          EXISTING_NUM=$(gh issue list --label "model-monitor" --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING_NUM" ]; then
            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "model-monitor" || \
            gh issue create \
              --title "$TITLE" \
              --body "$BODY"
            echo "Issue created."
          else
            gh issue comment "$EXISTING_NUM" --body "$BODY"
            echo "Commented on existing model-monitor issue #$EXISTING_NUM."
          fi

      - name: Print all-clear if no issues
        if: steps.checks.outputs.has_issues == 'false'
        run: echo "All health checks passed. No GitHub Issue needed."
