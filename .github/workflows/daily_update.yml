name: Daily Data Update & Prediction

on:
  schedule:
    # Run at 22:00 UTC daily — 2h after NYSE close (20:00 UTC), so all daily candles are final
    - cron: '0 22 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write
  issues: write

jobs:
  update-and-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download master_df from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/full_data
          gh release download latest \
            --pattern 'master_df.csv' \
            --dir data/full_data \
            --clobber || echo "No existing release found — will need initial upload"

      - name: Update data pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/update_data.py

      - name: Validate pipeline data quality
        id: validate
        continue-on-error: true
        run: |
          python scripts/validate_pipeline.py 2>&1 | tee /tmp/validate_output.txt
          exit ${PIPESTATUS[0]}

      - name: Open data-quality issue if validation failed
        if: steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="[Data Quality] Pipeline validation failed — $(date -u +%Y-%m-%d)"

          BODY=$(printf '%s\n' \
            '## Data Quality Alert' \
            '' \
            "**Date**: $(date -u +%Y-%m-%d)" \
            '' \
            'The daily pipeline validation script detected one or more failures.' \
            '' \
            '### Validation Output' \
            '```' \
            "$(cat /tmp/validate_output.txt)" \
            '```' \
            '' \
            '---' \
            '_Opened automatically by the Daily Data Update & Prediction workflow._')

          EXISTING=$(gh issue list --label "data-quality" --state open --json number --jq length)
          if [ "$EXISTING" -eq "0" ]; then
            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "data-quality" || \
            gh issue create \
              --title "$TITLE" \
              --body "$BODY"
            echo "Data quality issue created."
          else
            echo "Open data-quality issue already exists — skipping duplicate."
          fi

      - name: Train production model
        if: steps.validate.outcome == 'success'
        run: |
          python scripts/train_production.py

      - name: Make prediction and log it
        id: predict
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, 'app/model')
          sys.path.insert(0, 'src')
          from predict import predict_current, log_prediction, update_outcomes

          prediction = predict_current()
          if 'error' not in prediction:
              log_prediction(prediction)
              update_outcomes()
              print(f'Prediction logged: {prediction[\"direction\"]} ({prediction[\"predicted_return\"]:+.2%})')
              print(f'BTC: \${prediction[\"btc_price\"]:,.0f} -> \${prediction[\"predicted_price\"]:,.0f} (7d)')
          else:
              print(f'Prediction error: {prediction[\"error\"]}', file=sys.stderr)
              sys.exit(1)
          " 2>&1 | tee /tmp/predict_output.txt
          exit ${PIPESTATUS[0]}

      - name: Open prediction-failure issue if prediction failed
        if: steps.predict.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="[Prediction] Daily prediction failed — $(date -u +%Y-%m-%d)"

          BODY=$(printf '%s\n' \
            '## Prediction Failure Alert' \
            '' \
            "**Date**: $(date -u +%Y-%m-%d)" \
            '' \
            'The daily prediction step failed — no new prediction was logged.' \
            '' \
            '### Output' \
            '```' \
            "$(cat /tmp/predict_output.txt)" \
            '```' \
            '' \
            '**Common causes**: missing BTC price in master_df (run `update_data.py`), or no trained model.' \
            '' \
            '---' \
            '_Opened automatically by the Daily Data Update & Prediction workflow._')

          EXISTING=$(gh issue list --label "prediction-failure" --state open --json number --jq length)
          if [ "$EXISTING" -eq "0" ]; then
            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "prediction-failure" || \
            gh issue create \
              --title "$TITLE" \
              --body "$BODY"
            echo "Prediction failure issue created."
          else
            echo "Open prediction-failure issue already exists — skipping duplicate."
          fi

      - name: Upload updated master_df to release
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try upload with clobber; if it fails, delete and re-upload
          gh release upload latest data/full_data/master_df.csv --clobber || {
            echo "Upload failed, trying delete + re-upload..."
            gh release delete-asset latest master_df.csv --yes 2>/dev/null || true
            gh release upload latest data/full_data/master_df.csv
          }

      - name: Commit trade log and model
        if: steps.validate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/data/trade_log.csv models/xgboost_production.joblib 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Daily prediction: $(date -u +%Y-%m-%d)"
          git push || true
